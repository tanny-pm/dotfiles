onboarding = false

[ui]
agent_panel_sort = "spaces"
# 名前未設定のペインでも検出したエージェント名を分割ペインの枠に出す
show_agent_labels_on_pane_borders = true

# サイドバー(agents)の行レイアウト: タブ番号ではなくペイン名を出す
[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon", "workspace", "agent"], ["terminal_title_stripped"]]

[ui.toast]
delivery = "terminal"

# placement は herdr 0.7 で [ui.toast.herdr].position に移動
[ui.toast.herdr]
position = "bottom-right"

# 旧 ui.toast.sound は廃止。通知音は [ui.sound]（enabled はデフォルト true）で制御する

[experimental]
# official.browser プラグイン（Chromium をペインに描画）に必要
kitty_graphics = true
pane_history = false
# prefix モードの間だけ macOS の入力ソースを ASCII 系に切り替え、抜けたら元に戻す
switch_ascii_input_source_in_prefix = true

# TUI がカーソルを隠していても、IME が候補ウィンドウの位置を
# 追えるように外側のターミナルへカーソル位置を公開する
reveal_hidden_cursor_for_cjk_ime = true

# 上の設定を適用するエージェント（フォーカス中のペインで判定）
cjk_ime_agents = ["claude", "codex", "kiro", "omp"]
# IME 用に表示するカーソルの形状
cjk_ime_cursor_shape = "steady_block"

[theme]
name = "terminal"
auto_switch = false

# herdr-file-viewer: prefix+f で split 起動
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"
description = "Open file viewer in split pane"

# prefix+shift+f でタブ起動
[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"
description = "Open file viewer in new tab"

# herdr-plugin-hunk: prefix+h で worktree diff
[[keys.command]]
key = "prefix+h"
type = "shell"
command = "herdr plugin action invoke hunk.diff.worktree-split"
description = "Open worktree diff in split pane"
